name: Standalone installers
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: '--mac --arm64', executable: 'build/installers/mac-arm64/Aether CAD.app/Contents/MacOS/Aether CAD' }
          - { os: macos-15-intel, target: '--mac --x64', executable: 'build/installers/mac/Aether CAD.app/Contents/MacOS/Aether CAD' }
          - { os: windows-latest, target: '--win --x64', executable: 'build/installers/win-unpacked/Aether CAD.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/fetch-vendor.py
      - run: npm --prefix aether-engine ci
      - run: npm ci
      - run: npm run build
        env:
          AETHER_BUILD_PYTHON: python
      - run: npm run desktop:test
      - run: npx vitest run src/document/local-project.test.ts
      - run: python -m pip install pyinstaller==6.16.0
      - run: python desktop/build-service.py
      - run: npm run desktop:package -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm install --no-save --ignore-scripts @playwright/test@1.65.0
      - run: node scripts/verify-desktop.mjs
        env:
          AETHER_PLAYWRIGHT_PACKAGE: ${{ github.workspace }}/package.json
          AETHER_DESKTOP_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-CAD-${{ matrix.os }}
          path: |
            build/installers/*.dmg
            build/installers/*.exe
            build/installers/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evidence-${{ matrix.os }}
          path: build/desktop-smoke
  draft:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Aether-CAD-*
          path: installers
          merge-multiple: true
      - name: Prepare draft download release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd installers
          sha256sum *.dmg *.exe *.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" *.dmg *.exe *.zip SHA256SUMS.txt --verify-tag --draft --prerelease --title "Aether CAD standalone alpha" --notes "Offline CAD test installers. Same editor and modeling engine as hosted CAD. Mac builds are ad-hoc signed, not notarized; Windows builds are unsigned. Native installation and file-dialog acceptance remain to be checked before public promotion. Studio Server installation is not included."
